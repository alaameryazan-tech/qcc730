
#
# dtim10_control_demo setting - CONTROL BUILD: WLAN + MQTT + DTIM10/BMPS
# only, zero sensor code of any kind (see src/wifi_mqtt.c's top comment for
# why this exists - isolating demo/vcnl3020_test_demo's power-spike
# question from its sensor code). Deliberately no CONFIG_WIFI_SHELL/
# CONFIG_NET_SHELL - wifi_mqtt.c is shell/console-free by design, same as
# demo/vcnl3020_test_demo/prj.conf.
#
CONFIG_QCCSDK_CONSOLE=y
CONFIG_QCCSDK_DEMO=y
CONFIG_WLAN_QAPI=y
CONFIG_MQTT_CLIENT=y
# Pulls in drivers/lowpower/qapi_lowpower.c (qapi_pm_enable()/
# qapi_bmps_cfg(), used by wifi_mqtt.c's DTIM10/BMPS handling) - see
# drivers/BUILD.gn.
CONFIG_LOWPOWER_SHELL=y
# end of dtim10_control_demo setting
