
#
# vcnl3020_test_demo setting - VCNL3020 interrupt bring-up test (I2C +
# GPIO) plus a minimal WLAN + MQTT publisher (see src/wifi_mqtt.c) that
# reports every STATUS transition, same broker/account as
# demo/powertest_demo. WiFi connects, then DTIM10/BMPS engages 15s later;
# MQTT publish/heartbeat keep working the same either way. Deliberately no
# CONFIG_WIFI_SHELL/CONFIG_NET_SHELL - wifi_mqtt.c is shell/console-free by
# design (its own BUILD.gn lists the WLAN driver sources directly, and
# calls dhcp_start() itself instead of going through
# demo/common/net/src/net_shell.c).
#
CONFIG_QCCSDK_CONSOLE=y
CONFIG_QCCSDK_DEMO=y
CONFIG_WLAN_QAPI=y
CONFIG_MQTT_CLIENT=y
# Pulls in drivers/lowpower/qapi_lowpower.c (qapi_pm_enable()/
# qapi_bmps_cfg(), used by wifi_mqtt.c's DTIM10/BMPS handling) - see
# drivers/BUILD.gn.
CONFIG_LOWPOWER_SHELL=y
# end of vcnl3020_test_demo setting
